services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: baby_ricardito
    ports:
      # Only reachable from this machine (for `npm run api` and Prisma during development).
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d baby_ricardito"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://baby:${DB_PASSWORD:?Set DB_PASSWORD in the root .env}@db:5432/baby_ricardito
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Local only; Tailscale (`tailscale serve`) adds HTTPS for the phone. Use "8080:80" to open it to the LAN.
      - "127.0.0.1:8080:80"
    volumes:
      - photos:/srv/photos:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  photos:
