services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: baby_ricardito
    ports:
      # Only reachable from this machine; the api container will use the internal network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d baby_ricardito"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
