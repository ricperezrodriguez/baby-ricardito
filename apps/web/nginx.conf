server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos go up to 20 MB (PHOTO_MAX_BYTES); the multipart body adds a little.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  # API: the container named `api` on the compose network. No URI in proxy_pass keeps the /api prefix.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded photos are read straight from the volume the API writes to. Names are unique per upload.
  location /api/files/photos/ {
    alias /srv/photos/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # The service worker and its manifests must never be cached, or updates would not reach the phone.
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /ngsw.json { add_header Cache-Control "no-cache" always; }
  location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; }
  location = /safety-worker.js { add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

  # Hashed build files never change.
  location ~* \.(?:js|css|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Angular routes (e.g. /lactancia, /detalle/pecho) are resolved in the browser.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
