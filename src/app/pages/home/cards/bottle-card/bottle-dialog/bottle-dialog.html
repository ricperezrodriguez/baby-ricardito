<app-tracking-dialog-layout
  [title]="record.dialogTitle()"
  [saveLabel]="record.saveLabel()"
  [saveDisabled]="saveDisabled()"
  [saving]="record.saving()"
  [busy]="record.busy()"
  [confirmBeforeDiscard]="false"
  (save)="onSave()"
  (dismiss)="close()"
  (discard)="close()"
>
  @if (record.historyMode()) {
    <button
      dialogActionsStart
      matIconButton
      type="button"
      class="delete-button"
      [attr.aria-label]="record.texts.deleteLabel"
      [disabled]="record.busy() || record.saving()"
      (click)="deleteFeed()"
    >
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">delete</mat-icon>
    </button>
  }
  @if (record.loading()) {
    <app-loading-spinner [label]="record.texts.loadingLabel" />
  } @else {
    <section class="summary" aria-labelledby="summary-title">
      <h3 id="summary-title" class="summary-title">Datos del biberón</h3>
      <dl class="summary-list">
        <div class="summary-row">
          <dt>Fecha y hora</dt>
          <dd>
            <app-editable-time
              label="Fecha y hora"
              kind="datetime"
              [value]="fedAt()"
              [max]="maxFedAt()"
              [disabled]="record.editsDisabled()"
              (committed)="fedAt.set($event)"
            />
          </dd>
        </div>
        @if (record.readOnly()) {
          <div class="summary-row">
            <dt>Tipo de leche</dt>
            <dd>{{ milkTypeText() }}</dd>
          </div>
          <div class="summary-row">
            <dt>Cantidad</dt>
            <dd>{{ amountText() }}</dd>
          </div>
        }
      </dl>

      @if (!record.readOnly()) {
        <div class="field-group">
          <h4 class="group-title">Tipo de leche</h4>
          <app-choice-group
            label="Tipo de leche"
            [options]="milkTypeOptions"
            [value]="milkType()"
            [disabled]="record.editsDisabled()"
            (valueChange)="selectMilkType($event)"
          />
        </div>

        <div class="field-group">
          <app-quick-value-field
            label="Cantidad (ml)"
            suffix="ml"
            quickLabel="Cantidades habituales"
            [field]="form.amount"
            [quickValues]="quickAmounts"
            [formatQuick]="formatMl"
            [errorMessage]="amountError()"
          />
        </div>
      }

      <app-record-notes-field
        [field]="form.notes"
        [maxLength]="notesMaxLength"
        [readOnly]="record.readOnly()"
      />
    </section>
  }
</app-tracking-dialog-layout>
