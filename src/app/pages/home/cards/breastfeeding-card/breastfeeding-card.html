<app-tracking-card
  link="/detalle/pecho"
  title="Lactancias"
  dialogRoute="lactancia"
  (closed)="reload()"
  accent="var(--app-card-breastfeeding)"
  headerColor="var(--app-card-breastfeeding)"
  [contentOpensDialog]="isFeedOpen()"
  [active]="isFeedOpen()"
>
  <svg
    cardIcon
    viewBox="0 0 32 32"
    fill="none"
    [attr.width]="iconSize"
    [attr.height]="iconSize"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.6"
  >
    <path
      d="M11 6v3c0 2-2 3-3 4-2 2-3 4-3 7v4c0 2 2 3 4 3h14c2 0 4-1 4-3v-4c0-3-1-5-3-7-1-1-3-2-3-4V6"
    />
    <path
      d="M6 17c2-2 4-3 6-3 2.5 0 4 2 3 4.5-1 3-3 5.5-5.5 5.5-2.5 0-4.5-2-4.5-5M26 17c-2-2-4-3-6-3-2.5 0-4 2-3 4.5 1 3 3 5.5 5.5 5.5 2.5 0 4.5-2 4.5-5"
    />
    <path d="M11 19h.01M21 19h.01" stroke-width="2.4" />
  </svg>
  <app-async-state
    [status]="latestState().status"
    loadingLabel="Cargando la última toma"
    emptyMessage="Todavía no hay sesiones de lactancia registradas."
    errorMessage="No se pudo cargar la última toma."
    (retry)="reload()"
  >
    @if (latestState().status === 'loaded') {
      <app-last-record-summary [title]="feedStatus()" [secondaryLines]="[feedElapsed()]">
        <div summaryAside class="last-breast">
          @if (breastDurations() === null) {
            <span class="last-breast-caption">{{ lastBreastCaption() }}</span>
          }
          <svg
            class="breast-icon"
            viewBox="2 10 36 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              class="breast-lobe"
              [class.highlighted]="lastBreast() === breastSide.LEFT"
              d="M17 15c-3.5-3.5-9-3.5-11.5 0-2 3-1.5 9.5 1.3 13.2 2.4 3.2 6.2 3.7 8.7 1.5 2.8-2.5 3.6-6.8 1.5-10.4Z"
            />
            <path
              class="breast-lobe"
              [class.highlighted]="lastBreast() === breastSide.RIGHT"
              d="M23 15c3.5-3.5 9-3.5 11.5 0 2 3 1.5 9.5-1.3 13.2-2.4 3.2-6.2 3.7-8.7 1.5-2.8-2.5-3.6-6.8-1.5-10.4Z"
            />
            <circle class="breast-nipple" cx="10.5" cy="22" r="1.2" />
            <circle class="breast-nipple" cx="29.5" cy="22" r="1.2" />
          </svg>
          @if (breastDurations(); as durations) {
            <div class="breast-durations">
              <div class="breast-duration" role="group" aria-label="Izquierdo" [class.active]="lastBreast() === breastSide.LEFT">
                <span class="breast-duration-time">{{ durations.left }}</span>
              </div>
              <div class="breast-duration" role="group" aria-label="Derecho" [class.active]="lastBreast() === breastSide.RIGHT">
                <span class="breast-duration-time">{{ durations.right }}</span>
              </div>
            </div>
          } @else {
            <span class="last-breast-label">{{ lastBreastLabel() }}</span>
          }
        </div>
      </app-last-record-summary>
    }
  </app-async-state>
</app-tracking-card>
