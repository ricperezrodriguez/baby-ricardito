<app-tracking-dialog-layout
  [title]="record.dialogTitle()"
  [saveLabel]="record.saveLabel()"
  [saveDisabled]="saveDisabled()"
  [saving]="record.saving()"
  [busy]="record.busy()"
  [confirmBeforeDiscard]="false"
  (save)="onSave()"
  (dismiss)="close()"
  (discard)="close()"
>
  <app-record-delete-button dialogActionsStart [record]="record" (delete)="deleteDose()" />
  @if (record.loading()) {
    <app-loading-spinner [label]="record.texts.loadingLabel" />
  } @else {
    <section class="summary" aria-labelledby="summary-title">
      <h3 id="summary-title" class="summary-title">Datos de la dosis</h3>
      <dl class="summary-list">
        <div class="summary-row">
          <dt>Fecha y hora</dt>
          <dd>
            <app-editable-time
              label="Fecha y hora"
              kind="datetime"
              [value]="givenAt()"
              [max]="maxGivenAt()"
              [disabled]="record.editsDisabled()"
              (committed)="givenAt.set($event)"
            />
          </dd>
        </div>
        @if (record.readOnly() && dropsText()) {
          <div class="summary-row">
            <dt>Gotas</dt>
            <dd>{{ dropsText() }}</dd>
          </div>
        }
      </dl>

      <app-record-today-hint subject="una dosis" [at]="todayHint.at()" />

      @if (!record.readOnly()) {
        <div class="field-group">
          <app-quick-value-field
            label="Cantidad (gotas)"
            suffix="gotas"
            quickLabel="Gotas habituales"
            [field]="form.drops"
            [quickValues]="quickDrops"
            [formatQuick]="formatDrops"
            [errorMessage]="dropsError()"
          />
        </div>
      }

      <app-record-notes-field
        [field]="form.notes"
        [maxLength]="notesMaxLength"
        [readOnly]="record.readOnly()"
      />
    </section>
  }
</app-tracking-dialog-layout>
