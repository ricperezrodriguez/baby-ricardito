<app-tracking-dialog-layout
  [title]="record.dialogTitle()"
  [saveLabel]="record.saveLabel()"
  [saveDisabled]="saveDisabled()"
  [saving]="record.saving()"
  [busy]="record.busy()"
  [confirmBeforeDiscard]="false"
  (save)="onSave()"
  (dismiss)="close()"
  (discard)="close()"
>
  <app-record-delete-button dialogActionsStart [record]="record" (delete)="deleteTrim()" />
  @if (record.loading()) {
    <app-loading-spinner [label]="record.texts.loadingLabel" />
  } @else {
    <section class="summary" aria-labelledby="summary-title">
      <h3 id="summary-title" class="summary-title">Datos del corte</h3>
      <dl class="summary-list">
        <div class="summary-row">
          <dt>Fecha y hora</dt>
          <dd>
            <app-editable-time
              label="Fecha y hora"
              kind="datetime"
              [value]="trimmedAt()"
              [max]="maxTrimmedAt()"
              [disabled]="record.editsDisabled()"
              (committed)="trimmedAt.set($event)"
            />
          </dd>
        </div>
        @if (record.readOnly()) {
          <div class="summary-row">
            <dt>Zonas</dt>
            <dd>{{ areasText() }}</dd>
          </div>
        }
      </dl>

      <app-record-today-hint subject="un corte de uñas" [at]="todayHint.at()" />

      @if (!record.readOnly()) {
        <div class="field-group">
          <h4 class="group-title">Zonas</h4>
          <app-choice-group
            label="Zonas"
            [multiple]="true"
            [options]="areasOptions"
            [disabled]="record.editsDisabled()"
            [(values)]="areas"
          />
        </div>
      }

      <app-record-notes-field
        [field]="form.notes"
        [maxLength]="notesMaxLength"
        [readOnly]="record.readOnly()"
      />
    </section>
  }
</app-tracking-dialog-layout>
