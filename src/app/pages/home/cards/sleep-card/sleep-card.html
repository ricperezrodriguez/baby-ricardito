<app-tracking-card
  link="/detalle/sueno"
  title="Sueño"
  dialogRoute="sueno"
  (closed)="reload()"
  accent="var(--app-card-sleep)"
  headerColor="var(--app-card-sleep)"
  [contentOpensDialog]="isSleeping()"
  [active]="isSleeping()"
>
  <svg
    cardIcon
    viewBox="0 0 32 32"
    fill="currentColor"
    [attr.width]="iconSize"
    [attr.height]="iconSize"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.6"
  >
    <path d="M22.5 20.5A10 10 0 0 1 11 7.2 10 10 0 1 0 22.5 20.5Z" />
    <path
      d="m23 8 .7 1.8 1.8.7-1.8.7L23 13l-.7-1.8-1.8-.7 1.8-.7L23 8ZM17 4l.4 1 .9.4-.9.4-.4 1-.4-1-.9-.4.9-.4.4-1Z"
    />
  </svg>
  <app-async-state
    [status]="latestState().status"
    loadingLabel="Cargando el último sueño"
    emptyMessage="Todavía no hay periodos de sueño registrados."
    errorMessage="No se pudo cargar el último sueño."
    (retry)="reload()"
  >
    @if (latestState().status === 'loaded') {
      <app-last-record-summary [title]="title()" [secondaryLines]="secondaryLines()">
        @if (isSleeping()) {
          <button
            summaryAside
            class="wake-button"
            matButton="filled"
            type="button"
            [disabled]="waking()"
            (click)="$event.stopPropagation(); wakeUp()"
          >
            Despertar
          </button>
        }
      </app-last-record-summary>
    }
  </app-async-state>
</app-tracking-card>
