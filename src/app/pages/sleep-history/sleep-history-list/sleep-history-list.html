<app-history-list
  [list]="list"
  accent="var(--app-card-sleep)"
  timeWidth="9rem"
  loadingLabel="Cargando el historial"
  emptyMessage="Todavía no hay sueños registrados."
  errorMessage="No se ha podido cargar el historial."
  loadingMoreLabel="Cargando más sueños"
>
  @for (group of list.groups(); track group.key) {
    <app-history-day [key]="group.key" [heading]="group.heading" [summary]="group.summary">
      @for (row of group.rows; track row.id) {
        <li appHistoryRow [link]="row.link" [inProgress]="row.inProgress">
          <span historyTime>
            {{ row.startMs | date: 'HH:mm' }}
            @if (row.endMs !== null) {
              – {{ row.endMs | date: 'HH:mm' }}
              @if (row.endsNextDay) {
                <span class="next-day" aria-hidden="true">(+1)</span>
                <span class="visually-hidden">del día siguiente</span>
              }
            } @else {
              · En curso
            }
          </span>
          <span historyMain class="duration">{{ row.duration }}</span>
          <span historyDetails>
            <app-record-flags [hasNotes]="row.hasNotes" />
          </span>
        </li>
      }
    </app-history-day>
  }
</app-history-list>
