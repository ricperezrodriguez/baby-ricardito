<app-tracking-dialog-layout
  title="Añadir lactancia"
  [saveDisabled]="!hasSegments()"
  [saving]="saving()"
  [busy]="busy()"
  (save)="save()"
  (dismiss)="dismiss()"
  (discard)="discard()"
>
  @if (loading()) {
    <app-loading-spinner label="Cargando la toma en curso" />
  } @else {
    <div class="side-controls">
      @for (side of sideControls(); track side.breast) {
        <div class="side-control">
          <button
            matButton="tonal"
            type="button"
            class="side-button"
            [disabled]="busy() || saving()"
            [attr.aria-pressed]="side.active"
            (click)="toggle(side.breast)"
          >
            <mat-icon fontSet="material-symbols-outlined" class="side-icon" aria-hidden="true">
              {{ side.active ? 'stop' : 'play_arrow' }}
            </mat-icon>
            <span>{{ side.label }}</span>
          </button>
          <span
            class="side-time"
            role="timer"
            [attr.aria-label]="'Tiempo de ' + side.label.toLowerCase()"
          >
            {{ side.duration }}
          </span>
        </div>
      }
    </div>

    <section class="summary" aria-labelledby="summary-title">
      <h3 id="summary-title" class="summary-title">Datos de la toma</h3>
      <dl class="summary-list">
        @for (row of summaryRows(); track row.label) {
          <div class="summary-row">
            <dt>{{ row.label }}</dt>
            <dd>{{ row.value }}</dd>
          </div>
        }
      </dl>

      <div class="photo">
        <h4 class="photo-title">Foto</h4>
        @if (photoPreviewUrl(); as previewUrl) {
          <img class="photo-preview" alt="Foto de la toma" [src]="previewUrl" />
        }
        <input
          #photoInput
          class="photo-input"
          type="file"
          accept="image/*"
          (change)="selectPhoto(photoInput)"
        />
        <div class="photo-actions">
          <button
            matButton="tonal"
            type="button"
            [disabled]="busy() || saving()"
            (click)="photoInput.click()"
          >
            <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">
              {{ photoPreviewUrl() ? 'edit' : 'add_a_photo' }}
            </mat-icon>
            {{ photoPreviewUrl() ? 'Cambiar foto' : 'Añadir foto' }}
          </button>
          @if (photoPreviewUrl()) {
            <button matButton type="button" [disabled]="busy() || saving()" (click)="removePhoto()">
              <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">delete</mat-icon>
              Quitar foto
            </button>
          }
        </div>
      </div>

      <mat-form-field class="notes-field" appearance="outline">
        <mat-label>Notas</mat-label>
        <textarea matInput rows="3" [formField]="form.notes"></textarea>
      </mat-form-field>
    </section>
  }
</app-tracking-dialog-layout>
