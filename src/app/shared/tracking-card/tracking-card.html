<mat-card class="tracking-card" appearance="outlined">
  <div class="card-header">
    <div class="card-heading">
      <span class="card-icon" aria-hidden="true">
        <ng-content select="[cardIcon]" />
      </span>
      <h3 class="card-title">{{ title() }}</h3>
    </div>
    <button
      class="add-button"
      type="button"
      [attr.aria-label]="'Añadir ' + title()"
      (click)="openDialog()"
    >
      <span aria-hidden="true">+</span>
    </button>
  </div>
  <div class="card-content"><ng-content /></div>
  <mat-divider />
  <mat-card-actions class="tracking-card-actions" align="end">
    <a matButton [routerLink]="link()" [attr.aria-label]="ariaLabel() ?? 'Ver historial de ' + title()">
      Ver historial
    </a>
  </mat-card-actions>
</mat-card>
