<mat-card class="tracking-card" [class.active]="active()" appearance="outlined">
  <div class="card-header">
    <div class="card-heading">
      <span class="card-icon" aria-hidden="true">
        <ng-content select="[cardIcon]" />
      </span>
      <h3 class="card-title">{{ title() }}</h3>
      @if (active()) {
        <span class="active-badge"
          ><span class="active-dot" aria-hidden="true"></span>En curso</span
        >
      }
    </div>
    <button
      class="add-button"
      type="button"
      [attr.aria-label]="'Añadir ' + title()"
      (click)="openDialog()"
    >
      <span aria-hidden="true">+</span>
    </button>
  </div>
  <div
    class="card-content"
    [class.actionable]="contentOpensDialog() || opensLatestRecord()"
    [attr.role]="opensLatestRecord() ? 'button' : null"
    [attr.tabindex]="opensLatestRecord() ? 0 : null"
    [attr.aria-label]="opensLatestRecord() ? recordLabel() : null"
    (click)="openContent()"
    (keydown.enter)="openContentWithKey($event)"
    (keydown.space)="openContentWithKey($event)"
  >
    <div class="card-body">
      <ng-content />
    </div>
    @if (opensLatestRecord()) {
      <span class="card-chevron" aria-hidden="true">›</span>
    }
  </div>
  <mat-divider />
  <mat-card-actions class="tracking-card-actions" align="end">
    <a
      matButton
      [routerLink]="link()"
      [attr.aria-label]="ariaLabel() ?? 'Ver historial de ' + title()"
    >
      Ver historial
    </a>
  </mat-card-actions>
</mat-card>
